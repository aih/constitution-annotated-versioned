name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -t .
      - name: Browser test of ?date= resolution on the fixture site
        run: |
          uv run cav --data /tmp/fx import tests/fixtures/v1/constitution.congress.gov --at 2026-01-15T12:00:00Z
          uv run cav --data /tmp/fx import tests/fixtures/v2/constitution.congress.gov --at 2026-06-01T08:30:00Z
          uv run cav --data /tmp/fx build --out /tmp/fx-dist
          .venv/bin/cav serve --out /tmp/fx-dist --port 8765 & SERVER=$!; sleep 2
          npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          node tests/e2e.cjs http://localhost:8765; STATUS=$?; kill $SERVER; exit $STATUS

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # when called from snapshot.yml, include the commit it just pushed
      - id: check
        run: echo "has=$(ls data/snapshots/*.json >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.has == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.check.outputs.has == 'true'
        run: uv sync --locked
      - if: steps.check.outputs.has == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.has == 'true'
        run: uv run cav build --out dist --base "${{ steps.pages.outputs.base_path }}"
      - if: steps.check.outputs.has == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.check.outputs.has == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
