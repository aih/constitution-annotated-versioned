[project]
name = "constitution-annotated-versioned"
version = "0.1.0"
description = "Versioned static mirror of the Constitution Annotated"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "requests>=2.31",
]

[project.scripts]
cav = "cav.__main__:main"
cav-scrape = "cav.__main__:scrape"
cav-build = "cav.__main__:build"
cav-serve = "cav.__main__:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cav"]
